<!-- Mobile hamburger -->
<button class="menu-btn" (click)="toggleSidebar()" aria-label="Toggle menu">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <line x1="3" y1="6"  x2="21" y2="6"/>
    <line x1="3" y1="12" x2="21" y2="12"/>
    <line x1="3" y1="18" x2="21" y2="18"/>
  </svg>
</button>

<!-- Overlay (mobile) -->
<div class="sidebar-overlay" [class.visible]="isOpen" (click)="closeSidebar()"></div>

<!-- Sidebar -->
<nav class="sidebar" [class.open]="isOpen">

  <!-- Logo -->
  <div class="sidebar-logo">
    <div class="logo-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 18v-6a9 9 0 0118 0v6"/>
        <path d="M21 19a2 2 0 01-2 2h-1a2 2 0 01-2-2v-3a2 2 0 012-2h3z"/>
        <path d="M3 19a2 2 0 002 2h1a2 2 0 002-2v-3a2 2 0 00-2-2H3z"/>
      </svg>
    </div>
    <span class="logo-text">Helpdesk System</span>
  </div>

  <!-- Nav links -->
  <div class="sidebar-nav">

    <a class="nav-item"
       routerLink="/home"
       routerLinkActive="active"
       (click)="closeSidebar()">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </span>
      <span class="nav-label">Home</span>
    </a>

    <a class="nav-item"
       routerLink="/dashboard"
       routerLinkActive="active"
       (click)="closeSidebar()">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
      </span>
      <span class="nav-label">Dashboard</span>
    </a>

    <!-- Tickets accordion -->
    <div class="nav-group" [class.expanded]="ticketsExpanded">
      <button class="nav-item nav-group-trigger"
              [class.active]="ticketsExpanded"
              (click)="toggleTickets()">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 12V22H4V12"/>
            <path d="M22 7H2v5h20V7z"/>
            <path d="M12 22V7"/>
            <path d="M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7z"/>
            <path d="M12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/>
          </svg>
        </span>
        <span class="nav-label">Tickets</span>
        <span class="nav-chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round">
            <polyline points="18 15 12 9 6 15"/>
          </svg>
        </span>
      </button>

      <div class="nav-sub-list" *ngIf="ticketsExpanded">
        <a class="nav-sub"
           routerLink="/tickets"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }"
           (click)="closeSidebar()">
          <span class="dot"></span>
          Ticket List
        </a>
        <a class="nav-sub"
           routerLink="/tickets/create"
           routerLinkActive="active"
           (click)="closeSidebar()">
          <span class="dot"></span>
          Create Ticket
        </a>
      </div>
    </div>

    <a class="nav-item"
       routerLink="/users"
       routerLinkActive="active"
       (click)="closeSidebar()">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 00-3-3.87"/>
          <path d="M16 3.13a4 4 0 010 7.75"/>
        </svg>
      </span>
      <span class="nav-label">Users</span>
    </a>

    <a class="nav-item"
       routerLink="/profile"
       routerLinkActive="active"
       (click)="closeSidebar()">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </span>
      <span class="nav-label">Profile</span>
    </a>

    <a class="nav-item"
       routerLink="/contact"
       routerLinkActive="active"
       (click)="closeSidebar()">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07
                   A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.63
                   A2 2 0 012 .18h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81
                   a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6
                   l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7
                   a2 2 0 011.72 2.03z"/>
        </svg>
      </span>
      <span class="nav-label">Contact</span>
    </a>

    <a class="nav-item nav-logout"
       routerLink="/logout"
       (click)="closeSidebar()">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </span>
      <span class="nav-label">Logout</span>
    </a>

  </div>

  <!-- Footer user info -->
  <div class="sidebar-footer">
    <div class="user-avatar">MG</div>
    <div class="user-info">
      <span class="user-name">Mahesh Goyal</span>
      <span class="user-role">Employee</span>
    </div>
  </div>

</nav>
