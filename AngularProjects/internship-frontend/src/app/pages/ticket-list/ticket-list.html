<div class="container">
  <h1>🎫 Tickets</h1>

  <div *ngIf="loading">Loading...</div>

  <div *ngIf="!loading && tickets.length === 0">No tickets found</div>

  <div class="grid" *ngIf="tickets.length">
    <div class="card" *ngFor="let t of tickets">
      <h3>{{ t.title }}</h3>
      <p>{{ t.description }}</p>

      <div class="meta">
        <span>Status: {{ t.status }}</span>
        <span>Priority: {{ t.priority }}</span>
      </div>
    </div>
  </div>
</div>
