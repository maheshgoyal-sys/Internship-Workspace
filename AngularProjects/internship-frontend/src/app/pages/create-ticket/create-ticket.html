<div class="ct-page">

  <div class="ct-card">

    <div class="ct-header">
      <h2 class="ct-title">Create Ticket</h2>
      <p class="ct-subtitle">Fill in the details below to raise a new support ticket.</p>
    </div>

    <form (ngSubmit)="saveTicket()">

      <div class="form-group">
        <label>Title</label>
        <input
          type="text"
          name="title"
          placeholder="e.g. Unable to reset password"
          [(ngModel)]="ticket.title"
          required>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea
          name="description"
          rows="5"
          placeholder="Describe the issue in detail..."
          [(ngModel)]="ticket.description"
          required>
        </textarea>
      </div>

      <div class="form-group">
        <label>Priority</label>

        <select
          name="priority"
          [(ngModel)]="ticket.priority">

          <option value="Low">Low</option>
          <option value="Medium">Medium</option>
          <option value="High">High</option>

        </select>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Create Ticket
        </button>
      </div>

    </form>

  </div>

</div>
